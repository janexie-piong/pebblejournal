<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pebble Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f0ede6;
      --ink: #1d1d1d;
      --ink-soft: #888880;
      --ink-faint: #c4c1b8;
      --select: #dedbd3;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-transform: lowercase;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100svh;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 48px 0;
      opacity: 0;
      animation: fadeUp 1s ease 0.2s forwards;
    }

    .nav-logo {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.08em;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-cta {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .nav-cta:hover {
      color: var(--ink);
    }

    /* ── HERO ── */
    .hero {
      flex: 1;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      grid-template-areas: "copy phone cta";
      align-items: center;
      gap: clamp(32px, 4vw, 80px);
      position: relative;
      padding: 24px 48px 0;
    }

    .hero-copy {
      grid-area: copy;
      justify-self: end;
      text-align: right;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── APP NAME (single-line text selection) ── */
    .app-name {
      font-family: 'Atkinson Hyperlegible Mono', monospace;
      font-weight: 400;
      font-size: clamp(16px, 1.6vw, 20px);
      line-height: 1.5;
      color: var(--ink);
      text-transform: none;
    }

    .app-name .sel {
      position: relative;
      display: inline-block;
      padding: 0 6px;
      background: linear-gradient(var(--select), var(--select)) no-repeat 0 0 / 0% 100%;
      animation: select 0.6s cubic-bezier(0.65, 0, 0.35, 1) 2.0s forwards;
    }

    .app-name .sel::before,
    .app-name .sel::after {
      content: '';
      position: absolute;
      width: 8px;
      opacity: 0;
      animation: fadeUp 0.4s ease 2.6s forwards;
    }

    .app-name .sel::before {
      left: -4px;
      top: -7px;
      bottom: 0;
      background:
        radial-gradient(circle at 4px 4px, var(--ink) 3.5px, transparent 4px) no-repeat 0 0 / 8px 8px,
        linear-gradient(var(--ink), var(--ink)) no-repeat 3px 7px / 2px calc(100% - 7px);
    }

    .app-name .sel::after {
      right: -4px;
      top: 0;
      bottom: -7px;
      background:
        linear-gradient(var(--ink), var(--ink)) no-repeat 3px 0 / 2px calc(100% - 7px),
        radial-gradient(circle at 4px 4px, var(--ink) 3.5px, transparent 4px) no-repeat 0 100% / 8px 8px;
    }

    /* ── CAPTION (App Store style text selection) ── */
    .caption {
      font-family: 'Atkinson Hyperlegible Mono', monospace;
      font-weight: 400;
      font-size: clamp(18px, 1.8vw, 30px);
      line-height: 1.5;
      white-space: nowrap;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      opacity: 0;
      animation: fadeUp 1s ease 1.1s forwards;
    }

    .caption .line:nth-child(1) {
      margin-right: 3.5ch;
    }

    .caption .sel {
      position: relative;
      display: inline-block;
      padding: 0 6px;
      background: linear-gradient(var(--select), var(--select)) no-repeat 0 0 / 0% 100%;
      animation: select 0.8s cubic-bezier(0.65, 0, 0.35, 1) 1.6s forwards;
    }

    .caption .line:nth-child(2) .sel {
      animation-delay: 2.3s;
    }

    .caption .sel::before,
    .caption .sel::after {
      content: '';
      position: absolute;
      background: var(--ink);
      opacity: 0;
      animation: fadeUp 0.4s ease forwards;
    }

    .caption .line:nth-child(1) .sel::before {
      left: -1px;
      top: 0;
      bottom: 0;
      width: 2px;
      animation-delay: 1.6s;
    }

    .caption .line:nth-child(1) .sel::after {
      left: -4px;
      top: -7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation-delay: 1.6s;
    }

    .caption .line:nth-child(2) .sel::before {
      right: -1px;
      top: 0;
      bottom: 0;
      width: 2px;
      animation-delay: 3.1s;
    }

    .caption .line:nth-child(2) .sel::after {
      right: -4px;
      bottom: -7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation-delay: 3.1s;
    }

    @keyframes select {
      to { background-size: 100% 100%; }
    }

    /* ── PHONE ── */
    .phone {
      grid-area: phone;
      position: relative;
      height: min(720px, calc(100svh - 200px));
      min-height: 420px;
      aspect-ratio: 1206 / 2622;
      border: 1.5px solid var(--ink);
      border-radius: 48px;
      opacity: 0;
      animation: floatIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    .screen {
      position: absolute;
      inset: 5px;
      border-radius: 43px;
      overflow: hidden;
      background: #0f0f0f;
      container-type: inline-size;
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      height: 16.4cqw;
      padding: 0 7cqw 0 10cqw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      font-size: 4.3cqw;
      font-weight: 600;
      text-transform: none;
    }

    .status-island {
      position: absolute;
      left: 50%;
      top: 3.2cqw;
      width: 43cqw;
      height: 9.6cqw;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #000;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 1.4cqw;
    }

    .status-icons svg {
      height: 2.8cqw;
      width: auto;
    }

    .screen-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .screen-poster {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .screen.is-playing .screen-poster {
      opacity: 0;
    }

    .screen-video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
    }

    .hero-sub {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      font-weight: 400;
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 420px;
      margin: 0 auto 48px;
      opacity: 0;
      animation: fadeUp 1s ease 1.3s forwards;
    }

    .hero-actions {
      grid-area: cta;
      justify-self: start;
      margin-left: clamp(16px, 2.5vw, 48px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: flex-start;
      opacity: 0;
      animation: fadeUp 1s ease 1.5s forwards;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--ink);
      color: var(--bg);
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 100px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .btn-primary:hover {
      opacity: 0.75;
      transform: translateY(-1px);
    }

    /* ── DIVIDER ── */
    .section-divider {
      width: 1px;
      height: 80px;
      background: var(--ink-faint);
      margin: 0 auto;
      opacity: 0;
      animation: fadeUp 1s ease 1.7s forwards;
    }

    /* ── FEATURES ── */
    .features {
      padding: 120px 48px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 64px 48px;
    }

    .feature {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .feature.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .feature-num {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--ink-faint);
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    .feature-title {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 12px;
      letter-spacing: 0.01em;
    }

    .feature-body {
      font-size: 14px;
      line-height: 1.75;
      color: var(--ink-soft);
    }

    /* ── CLOSING ── */
    .closing {
      padding: 140px 48px 100px;
      text-align: center;
      max-width: 640px;
      margin: 0 auto;
    }

    .closing-pebble {
      width: clamp(40px, 6vw, 60px);
      opacity: 0.18;
      margin: 0 auto 48px;
      display: block;
    }

    .closing-text {
      font-family: 'Atkinson Hyperlegible Next', sans-serif;
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 400;
      font-style: italic;
      line-height: 1.3;
      color: var(--ink);
      margin-bottom: 48px;
    }

    .closing-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── FOOTER ── */
    footer {
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-name {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #590202;
      text-decoration: none;
      text-underline-offset: 3px;
    }

    .footer-name:hover {
      text-decoration: underline;
    }

    .footer-note {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #590202;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 1000px) {
      .caption {
        font-size: clamp(14px, 3.8vw, 19px);
      }

      .caption .sel {
        background: none;
        animation: none;
        padding: 0;
      }

      .caption .sel::before,
      .caption .sel::after {
        display: none;
      }

      .app-name {
        font-size: clamp(18px, 5vw, 22px);
      }

      .hero {
        grid-template-columns: 1fr;
        grid-template-areas: "copy" "phone" "cta";
        justify-items: center;
        text-align: center;
        gap: 28px;
        padding: 32px 24px 40px;
      }

      .hero-copy {
        justify-self: center;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .caption {
        align-items: center;
      }

      .caption .line:nth-child(1) {
        margin-right: 0;
      }

      .hero-actions {
        justify-self: center;
        margin-left: 0;
        align-items: center;
        margin-bottom: 16px;
      }

      .phone {
        height: min(620px, calc(100svh - 250px));
        min-height: 400px;
      }
    }

    @media (max-width: 768px) {
      nav {
        padding: 24px 28px 0;
      }

      .features {
        padding: 80px 28px;
      }

      .features-grid {
        grid-template-columns: 1fr;
        gap: 48px;
      }

      .closing {
        padding: 100px 28px 80px;
      }

      footer {
        padding: 28px;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <p class="app-name"><span class="sel">Pebble Journal.</span></p>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-copy">
      <h1 class="caption">
        <span class="line"><span class="sel">a quiet journal</span></span>
        <span class="line"><span class="sel">for everyday pebbles.</span></span>
      </h1>
    </div>

    <div class="phone">
      <div class="screen">
        <div class="status-bar" aria-hidden="true">
          <span>9:41</span>
          <span class="status-island"></span>
          <span class="status-icons">
            <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 4.3a10 10 0 0 1 14 0"/><path d="M3.6 6.9a6.3 6.3 0 0 1 8.8 0"/><path d="M8 11.2 6.1 9.3a2.7 2.7 0 0 1 3.8 0L8 11.2z" fill="currentColor" stroke-width="1"/></svg>
            <svg viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="19" height="8" rx="1.8" fill="currentColor"/><rect x="24" y="4" width="1.6" height="4" rx="0.8" fill="currentColor" fill-opacity="0.4"/></svg>
          </span>
        </div>
        <img class="screen-poster" src="pebble-demo-poster.jpg" alt="" />
        <video class="screen-video" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="pebble-demo-poster.jpg" disablepictureinpicture disableremoteplayback aria-label="Pebble Journal app demo">
          <source src="pebble-demo.mov" type='video/mp4; codecs="hvc1"' />
          <source src="pebble-demo.mp4" type="video/mp4" />
        </video>
      </div>
    </div>

    <div class="hero-actions">
      <a href="https://apps.apple.com/us/app/pebble-journal/id6760788352" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        App Store
      </a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <a href="privacy-policy.html" class="footer-name">Privacy Policy</a>
    <span class="footer-note">© 2026 · pebblejournal.app</span>
  </footer>

  <script>
    // Scroll-triggered feature reveals
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          const delay = entry.target.dataset.delay || 0;
          setTimeout(() => entry.target.classList.add('visible'), delay);
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.feature').forEach((el, i) => {
      el.dataset.delay = i * 120;
      observer.observe(el);
    });

    // Keep the demo video looping even if the browser pauses it
    const demo = document.querySelector('.screen-video');
    demo.muted = true;
    const keepPlaying = () => {
      if (!document.hidden && demo.paused) demo.play().catch(() => {});
    };
    demo.addEventListener('playing', () => demo.parentElement.classList.add('is-playing'));
    demo.addEventListener('pause', keepPlaying);
    demo.addEventListener('canplay', keepPlaying);
    document.addEventListener('visibilitychange', keepPlaying);

    // Fall back to H.264 if the HEVC source can't be decoded
    demo.addEventListener('error', () => {
      if (!demo.currentSrc.endsWith('.mp4')) {
        demo.src = 'pebble-demo.mp4';
        demo.load();
      }
    }, true);

    // Retry when the phone scrolls into view (mobile layout)
    new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) keepPlaying();
    }).observe(demo);

    // Autoplay can be blocked (e.g. iPhone Low Power Mode) until the first tap
    ['touchstart', 'pointerdown', 'keydown'].forEach((type) => {
      window.addEventListener(type, keepPlaying, { once: true, passive: true });
    });

    keepPlaying();
  </script>

</body>
</html>
